name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        freebsd-version: ['15.1']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build acpi_video.ko in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git
          run: |
            make build BRANCH="releng/${{ matrix.freebsd-version }}"

      - name: Rename artifact
        run: cp acpi_video.ko "acpi_video-${{ matrix.freebsd-version }}.ko"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: acpi_video-${{ matrix.freebsd-version }}
          path: acpi_video-${{ matrix.freebsd-version }}.ko

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: acpi_video-*
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: acpi_video-*.ko
          generate_release_notes: true
