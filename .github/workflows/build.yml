name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build acpi_video.ko in FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y git
          run: |
            make build

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: acpi_video.ko
          generate_release_notes: true
